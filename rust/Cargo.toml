[package]
name = "rust_lib_gyotaku"
description = "The gyotaku index, as the Flutter app calls it"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
# The index, search and readers are the gyotaku desktop project's own crates.
# Pinned to a commit of a fork that carries the Bengali reader and read_rest
# until those are merged upstream (xevrion/gyotaku#8 and #10); after that
# this points at xevrion/gyotaku.
gyotaku-core = { git = "https://github.com/zamansheikh/gyotaku", rev = "684d6b21583ad707cdea992311dcf535d3bacecf" }
gyotaku-ocr = { git = "https://github.com/zamansheikh/gyotaku", rev = "684d6b21583ad707cdea992311dcf535d3bacecf" }
anyhow = "1.0"
# Only for the type the readers take an image as. The decoders are theirs.
image = { version = "0.25", default-features = false }
flutter_rust_bridge = "=2.13.0"

# Only to lower the priority of the reading threads.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
